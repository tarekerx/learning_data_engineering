version: '3.8'

services:
  retail_db:
    image: postgres:15-alpine
    container_name: retail_db_container
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - retail_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  user_fetching:
    build: .
    container_name: user_fetching_container
    environment:
      - POSTGRES_HOST=retail_db  # Must match the service name above!
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_PORT=${POSTGRES_PORT}
    depends_on:
      retail_db:
        condition: service_healthy
    networks:
      - retail_network

volumes:
  postgres_data:

networks:
  retail_network:
    driver: bridge